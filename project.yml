name: just-right
options:
  bundleIdPrefix: com.opendente
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_UPCOMING_FEATURE_GLOBAL_ACTOR_ISOLATED_TYPES_USABILITY: false
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
      COPY_PHASE_STRIP: YES

schemes:
  JustRight:
    build:
      targets:
        JustRight: all
    test:
      targets:
        - JustRightTests

targets:
  JustRight:
    type: application
    platform: macOS
    sources:
      - path: OpenDente
        excludes:
          - Resources/Assets.xcassets/AppIcon.appiconset
      - path: Shared
    resources:
      - path: OpenDente/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: OpenDente/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenDente/Resources/OpenDente.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.app
        PRODUCT_NAME: just-right
        PRODUCT_MODULE_NAME: JustRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8A4G7KXRPM
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: OpenDente/Resources/OpenDente.entitlements
    dependencies:
      - target: JustRightHelper
      - package: Sparkle
        product: Sparkle
    # Grimnir/SMB can force 0700; Sparkle's executables must remain 0755.
    postCompileScripts:
      - name: "Normalize Sparkle Permissions"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          if [ -d "$APP" ]; then
            find "$APP" -name '._*' -delete 2>/dev/null || true
            find "$APP" -name '.DS_Store' -delete 2>/dev/null || true
            /usr/bin/xattr -cr "$APP" 2>/dev/null || true
            if [ -d "$APP/Contents/Frameworks/Sparkle.framework" ]; then
              find "$APP/Contents/Frameworks/Sparkle.framework" \
                \( -name Sparkle -o -name Autoupdate -o -name Updater -o -name Downloader -o -name Installer \) \
                -type f -exec chmod 755 {} + 2>/dev/null || true
            fi
            if [ -d "$APP/Contents/MacOS" ]; then
              find "$APP/Contents/MacOS" -type f -exec chmod 755 {} + 2>/dev/null || true
            fi
          fi
    postBuildScripts:
      - name: "Bundle Helper & Stamp Revision"
        script: |
          # Preserve the numeric CFBundleVersion Sparkle uses for update ordering,
          # and record the source revision separately for diagnostics.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          GIT_HASH=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "dev")
          /usr/libexec/PlistBuddy -c "Add :JustRightGitCommit string ${GIT_HASH}" "${PLIST}" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :JustRightGitCommit ${GIT_HASH}" "${PLIST}"

          # Copy helper tool into app bundle
          HELPER_TOOLS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/HelperTools"
          mkdir -p "${HELPER_TOOLS_DIR}"
          cp "${BUILT_PRODUCTS_DIR}/com.opendente.helper" "${HELPER_TOOLS_DIR}/com.opendente.helper"

          # Copy helper LaunchDaemon plist into app bundle
          LAUNCH_DAEMONS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "${LAUNCH_DAEMONS_DIR}"
          cp "${SRCROOT}/OpenDenteHelper/com.opendente.helper.plist" "${LAUNCH_DAEMONS_DIR}/com.opendente.helper.plist"
        basedOnDependencyAnalysis: false

  JustRightHelper:
    type: tool
    platform: macOS
    sources:
      - path: OpenDenteHelper
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
      - path: OpenDente/Services/SMCService.swift
      - path: OpenDente/Models/BatteryState.swift
    settings:
      base:
        INFOPLIST_FILE: OpenDenteHelper/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.helper
        PRODUCT_NAME: com.opendente.helper
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8A4G7KXRPM
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: OpenDenteHelper/OpenDenteHelper.entitlements

  JustRightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenDenteTests
    dependencies:
      - target: JustRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/just-right.app/Contents/MacOS/just-right"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8A4G7KXRPM
